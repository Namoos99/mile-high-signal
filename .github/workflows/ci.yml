name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests spark_jobs scripts warehouse dashboard dags

      - name: Format check
        run: ruff format --check src tests spark_jobs scripts warehouse dashboard dags

      - name: Test
        # No credentials and no network calls: ArcGIS is stubbed with `responses`
        # and S3 with `moto`. The warehouse tests are pure logic, not a live
        # Postgres connection — see docs/DECISIONS.md AD-014 for why that's a
        # deliberate CI/local split, not an oversight.
        run: pytest --cov=denver311 --cov-report=term-missing --cov-fail-under=80
