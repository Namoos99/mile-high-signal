[project]
name = "denver311"
version = "0.1.0"
description = "Scheduled ETL pipeline for Denver 311 service requests"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyspark>=3.5,<3.6",
    "pandas>=2.2",
    "psycopg2-binary>=2.9",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "responses>=0.25", "moto[s3]>=5.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "warehouse", "dashboard"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
